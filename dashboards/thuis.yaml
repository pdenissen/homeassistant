          - type: heading
            heading: Keuken
            heading_style: title
            icon: mdi:stove
            badges:
              - type: entity
                entity: light.kitchen_kitchen
                tap_action:
                  action: toggle
          - type: tile
            entity: light.kitchen_kitchen
            name: Alle spots
            features:
              - type: light-brightness
            grid_options:
              columns: 12
              rows: 2
          - type: tile
            entity: scene.kitchen_kitchen_normaal_licht
            name: Normaal
            hide_state: true
            grid_options:
              columns: 6
              rows: 1
          - type: tile
            entity: scene.kitchen_kitchen_dimmed
            name: Gedimd
            hide_state: true
            grid_options:
              columns: 6
              rows: 1
          - type: tile
            entity: scene.kitchen_kitchen_relax
            name: Relax
            hide_state: true
            grid_options:
              columns: 6
              rows: 1
          - type: tile
            entity: scene.kitchen_kitchen_nightlight
            name: Nacht
            hide_state: true
            grid_options:
              columns: 6
              rows: 1

          - type: heading
