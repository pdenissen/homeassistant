title: Thuis
views:
  - title: Thuis
    path: home
    icon: mdi:home-variant
    type: sections
    max_columns: 2
    dense_section_placement: true
    header:
      layout: responsive
      badges_position: bottom
      card:
        type: markdown
        content: |
          {% set h = now().hour %}
          {% if h < 6 %}# Goedenacht
          {% elif h < 12 %}# Goedemorgen
          {% elif h < 18 %}# Goedemiddag
          {% else %}# Goedenavond
          {% endif %}
          {{ state_attr('weather.forecast_home', 'temperature') | round(0, 'common') }}° · {{ states('weather.forecast_home') | replace('-', ' ') | title }}
    badges:
      - type: entity
        entity: person.pierre_denissen
        show_name: true
      - type: entity
        entity: weather.forecast_home
        show_name: false
      - type: entity
        entity: sun.sun
        show_name: false
      - type: entity
        entity: todo.shopping_list
        show_name: true
    sections:
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Weer
            heading_style: title
            icon: mdi:weather-partly-cloudy
          - type: weather-forecast
            entity: weather.forecast_home
            forecast_type: daily
            show_current: true
            show_forecast: true
            grid_options:
              columns: 12
              rows: 5

      - type: grid
        column_span: 2
        visibility:
          - condition: numeric_state
            entity: sensor.office_pierre_hue_dimmer_switch_1_battery
            below: 20
        cards:
          - type: heading
            heading: Aandacht
            heading_style: title
            icon: mdi:battery-alert
          - type: tile
            entity: sensor.office_pierre_hue_dimmer_switch_1_battery
            name: Office dimmer batterij
            color: red
            grid_options:
              columns: 6
              rows: 1

      - type: grid
        cards:
          - type: heading
            heading: Woonkamer
            heading_style: title
            icon: mdi:sofa-outline
            badges:
              - type: entity
                entity: light.woonkamer_woonkamer
                tap_action:
                  action: toggle
          - type: tile
            entity: light.woonkamer_woonkamer
            name: Alle lampen
            features:
              - type: light-brightness
            grid_options:
              columns: 12
              rows: 2
          - type: tile
            entity: light.living
            name: Living
            grid_options:
              columns: 6
              rows: 1
          - type: tile
            entity: light.woonkamer_lightstrip_tv
            name: TV-strip
            grid_options:
              columns: 6
              rows: 1
          - type: tile
            entity: light.woonkamer_lightstrip_kast
            name: Kast-strip
            grid_options:
              columns: 6
              rows: 1
          - type: heading
            heading: Sfeer
            heading_style: subtitle
            icon: mdi:palette-outline
          - type: tile
            entity: scene.woonkamer_woonkamer_relax
            name: Relax
            icon: mdi:weather-sunset
            hide_state: true
            grid_options:
              columns: 6
              rows: 1
          - type: tile
            entity: scene.woonkamer_woonkamer_gezelligheid
            name: Gezellig
            icon: mdi:fireplace
            hide_state: true
            grid_options:
              columns: 6
              rows: 1
          - type: tile
            entity: scene.living_tv_mode
            name: TV
            icon: mdi:television
            hide_state: true
            grid_options:
              columns: 6
              rows: 1
          - type: tile
            entity: scene.woonkamer_woonkamer_warm_lights
            name: Warm
            icon: mdi:lightbulb-night
            hide_state: true
            grid_options:
              columns: 6
              rows: 1

      - type: grid
